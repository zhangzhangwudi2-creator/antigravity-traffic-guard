# Clash Verge Rev Global Merge Template (profiles/Merge.yaml)
# Enables TLS/HTTP/QUIC SNI sniffing even on pure-IP connections so telemetry domain rules match accurately.

mode: rule
ipv6: false

profile:
  store-selected: true

dns:
  ipv6: false
  use-system-hosts: false

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443]
